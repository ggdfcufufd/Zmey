<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка P2P</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#d3dbb0,#161b11);--board:light-dark(#bcc88f,#1f2718);--soft:light-dark(#adbb7e,#2a3521);--ink:light-dark(#1f2a14,#cfdc9b);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:14px;display:flex;justify-content:center}
main{width:100%;max-width:880px;display:flex;flex-direction:column;gap:12px}
main>h1,#menu,#net{width:100%;max-width:440px;align-self:center}
h1{margin:6px 0 0;font-size:28px;letter-spacing:-.02em}
h1 small{font-size:13px;font-weight:600;letter-spacing:0;opacity:.7}
section{display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
p{margin:0}
button,textarea,input{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:4px;padding:12px}
button{cursor:pointer;font-weight:700;transition:transform .18s ease,background .2s ease,box-shadow .2s ease}button:hover{transform:translateY(-2px);box-shadow:0 5px 14px #0002}button:active{transform:translateY(1px) scale(.98)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pr{background:var(--ink);color:var(--bg)}
textarea{height:68px;resize:none;width:100%;background:var(--board);font-size:30px;text-align:center;letter-spacing:.2em;text-transform:uppercase;padding:14px}
canvas{width:100%;max-width:600px;margin:0 auto;aspect-ratio:1;display:block;border:3px solid var(--ink);border-radius:4px;touch-action:none;background:#000}
.row{display:flex;justify-content:space-between;gap:8px}
.row button{flex:1}
#nick{width:100%;background:var(--board);font-size:18px}
.m{display:inline-block;width:12px;height:12px;background:var(--me,#00a83b);margin-right:6px;border-radius:3px;box-shadow:0 0 8px var(--me,#00a83b)}
.m.o{background:var(--en,#ff4545);border:0;border-radius:3px;box-shadow:0 0 8px var(--en,#ff4545)}
.pick{display:flex;flex-direction:column;gap:6px;font-size:13px}.pick b{font-size:14px}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw .c{width:36px;height:36px;padding:0;border-radius:6px}.sw .cp{cursor:pointer;background:none;border:2px solid var(--ink)}.sw .c.on{outline:3px solid var(--ink);outline-offset:2px}
#st{text-align:center}
#hud{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
#prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.35}
#pt{font-size:15px}
#bar{height:12px;border:2px solid var(--ink);border-radius:4px;background:var(--board);overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
#jcol{display:flex;flex-direction:column;align-items:center;gap:6px}
#len{font-size:17px;font-weight:700;white-space:nowrap}
#joy{position:relative;width:min(44vw,160px);aspect-ratio:1;margin:0;border:3px solid var(--ink);border-radius:50%;background:linear-gradient(var(--soft),var(--soft)) center/100% 3px no-repeat,linear-gradient(var(--soft),var(--soft)) center/3px 100% no-repeat,var(--board);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#knob{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;margin:-20% 0 0 -20%;border-radius:50%;background:var(--ink);pointer-events:none}
#joy{display:block;cursor:grab}
#tree{align-self:flex-start;padding:6px 12px;font-size:14px}
#tr{position:fixed;inset:0;z-index:9;background:#0009;display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
#trb{width:100%;max-width:440px;max-height:100%;overflow:auto;background:var(--bg);border:3px solid var(--ink);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
#trb p{font-size:13px}
.sl{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:4px;padding:10px;background:var(--board);text-align:left;width:100%}
.sl.on{background:var(--ink);color:var(--bg)}.sl.off{opacity:.55}.sl.go{justify-content:center}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
#admin{position:fixed;inset:0;z-index:12;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
#adminBox{width:100%;max-width:440px;max-height:90%;overflow:auto;background:var(--bg);border:3px solid var(--ink);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:9px}
#adminBox input,#adminBox select{width:100%;background:var(--board);color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:10px;font:inherit}
#adminControls{display:flex;flex-direction:column;gap:8px}
#adminRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#staminaHud{width:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
#staminaTop{display:flex;justify-content:space-between;gap:8px;font-size:13px}
#staminaBar{height:14px;border:2px solid var(--ink);background:#292929;border-radius:4px;overflow:hidden}
#staminaFill{height:100%;width:100%;background:#00e878;transition:width .12s}
#dashButton{background:#075d91;color:#fff;border-color:#51c7ff;width:100%;max-width:600px;margin:0 auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<main>
<h1>Змейка P2P <small id="ver"></small></h1>
<section id="menu">
<p id="mh">Онлайн: нажмите «Играть онлайн» или создайте комнату для друга. Сервер только знакомит вас, сама игра идёт напрямую между браузерами.</p>
<input id="nick" maxlength="12" placeholder="Ваш ник" autocomplete="off">
<div class="pick"><b>Моя змейка</b><div class="sw" id="swMe"></div></div>
<div class="pick"><b>Змейка врага</b><div class="sw" id="swEn"></div></div>
<button class="pr" id="b4">Играть онлайн</button>
<button id="b2">Создать комнату для друга</button>
<button id="b3">Войти по коду</button>
<button id="b1">Играть одному</button>
</section>
<section id="net" hidden>
<p id="hint"></p>
<textarea id="out" readonly></textarea>
<button id="cp">Копировать код</button>
<textarea id="in" maxlength="5" placeholder="КОД"></textarea>
<button class="pr" id="ok">Подключиться</button>
<button id="bk">Назад</button>
</section>
<section id="game" hidden>
<div class="row"><span id="s0"></span><span id="s1"></span></div>
<button id="adminOpen" type="button">Админ-панель</button>
<canvas id="cv" width="600" height="600"></canvas>
<div id="staminaHud"><div id="staminaTop"><b>STAMINA</b><b><span id="staminaValue">270</span> / <span id="staminaMaxValue">270</span></b></div><div id="staminaBar"><div id="staminaFill"></div></div><button id="dashButton" type="button">DASH · 25 STAMINA</button></div>
<p id="st"></p>
<div id="hud">
<div id="prog"><button type="button" id="tree">🌳 Древо</button><b id="pt"></b><span id="pn"></span><div id="bar"><i id="fill"></i></div></div>
<div id="jcol"><p id="len"></p><div id="joy"><div id="knob"></div></div></div>
</div>
<div class="row"><button class="pr" id="go">Старт</button><button id="ex">Выйти</button></div>
</section>
</main>
<div id="tr" hidden><div id="trb"></div></div>
<div id="admin" hidden><div id="adminBox"></div></div>

<!-- ИСПРАВЛЕННЫЙ загрузчик игрового скрипта -->
<script>
(function(){
var b=atob('ВСТАВЬТЕ_СЮДА_ВАШУ_BASE64_СТРОКУ_ИЗ_ОРИГИНАЛА');
var p='';
for(var i=0;i<b.length;i++){
p+='%'+('0'+b.charCodeAt(i).toString(16)).slice(-2);
}
var s=document.createElement('script');
s.text=decodeURIComponent(p);
s.onerror=function(e){console.error('game script error',e);};
(document.body||document.documentElement).appendChild(s);
})();
</script>
</body>
</html>
