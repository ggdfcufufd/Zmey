<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Змейка P2P</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#d3dbb0,#161b11);--board:light-dark(#bcc88f,#1f2718);--soft:light-dark(#adbb7e,#2a3521);--ink:light-dark(#1f2a14,#cfdc9b);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:600 15px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:14px;display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
h1{margin:6px 0 0;font-size:28px;letter-spacing:-.02em}
section{display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
p{margin:0}
button,textarea{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:4px;padding:12px}
button{cursor:pointer;font-weight:700}
button:active{transform:translateY(2px)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pr{background:var(--ink);color:var(--bg)}
textarea{height:88px;resize:none;width:100%;background:var(--board);word-break:break-all;font-size:16px}
canvas{width:100%;aspect-ratio:1;display:block;border:3px solid var(--ink);border-radius:4px;touch-action:none;background:var(--board)}
.row{display:flex;justify-content:space-between;gap:8px}
.m{display:inline-block;width:12px;height:12px;background:var(--ink);margin-right:6px}
.m.o{background:none;border:3px solid var(--ink)}
#st{text-align:center}
#pad{display:none;grid-template-columns:repeat(4,1fr);gap:8px}
#pad button{font-size:22px;padding:16px 0}
@media(pointer:coarse){#pad{display:grid}}
</style>
</head>
<body>
<main>
<h1>Змейка P2P</h1>
<section id="menu">
<p>Игра с другом по интернету: браузеры соединяются напрямую (WebRTC), игровой сервер не нужен.</p>
<button class="pr" id="b2">Создать комнату</button>
<button id="b3">Войти по коду</button>
<button id="b1">Играть одному</button>
</section>
<section id="net" hidden>
<p id="hint"></p>
<textarea id="out" readonly placeholder="Ваш код появится здесь"></textarea>
<button id="cp">Копировать мой код</button>
<textarea id="in" placeholder="Вставьте код сюда"></textarea>
<button class="pr" id="ok"></button>
<button id="bk">Назад</button>
</section>
<section id="game" hidden>
<div class="row"><span id="s0"></span><span id="s1"></span></div>
<canvas id="cv" width="600" height="600"></canvas>
<p id="st"></p>
<div id="pad"><button data-v="-1,0">◀</button><button data-v="0,-1">▲</button><button data-v="0,1">▼</button><button data-v="1,0">▶</button></div>
<button class="pr" id="go">Старт</button>
<button id="ex">Выйти</button>
</section>
</main>
<script>
const $=i=>document.getElementById(i),N=20,TICK=130,cv=$('cv'),cx=cv.getContext('2d');
const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let role,pc,dc,G,tm;
const show=id=>['menu','net','game'].forEach(k=>$(k).hidden=k!=id);
const rnd=n=>Math.floor(Math.random()*n);
const txt=(i,t)=>{$(i).textContent=t};
const tx=o=>dc&&dc.readyState=='open'&&dc.send(JSON.stringify(o));

/* ---- симуляция (хост / одиночная игра) ---- */
function init(n){
 const A=[[4,10,1,0],[15,10,-1,0]].slice(0,n);
 G={n,s:A.map(([x,y,a,b])=>[[x,y],[x-a,y-b],[x-2*a,y-2*b]]),d:A.map(a=>[a[2],a[3]]),nd:A.map(a=>[a[2],a[3]]),sc:[0,0],over:0,w:-1};
 food();
}
function food(){let p;do p=[rnd(N),rnd(N)];while(G.s.some(s=>s.some(c=>c[0]==p[0]&&c[1]==p[1])));G.f=p}
function turn(i,x,y){const d=G.d[i];if(d&&Math.abs(x)+Math.abs(y)==1&&(d[0]+x||d[1]+y))G.nd[i]=[x,y]}
function step(){
 const h=G.s.map((s,i)=>{G.d[i]=G.nd[i];return[s[0][0]+G.d[i][0],s[0][1]+G.d[i][1]]});
 const ate=h.map(p=>p[0]==G.f[0]&&p[1]==G.f[1]);
 const dead=h.map((p,i)=>p[0]<0||p[1]<0||p[0]>=N||p[1]>=N||G.s.some((o,j)=>(ate[j]?o:o.slice(0,-1)).some(c=>c[0]==p[0]&&c[1]==p[1]))||h.some((q,j)=>j!=i&&q[0]==p[0]&&q[1]==p[1]));
 G.s.forEach((s,i)=>{if(dead[i])return;s.unshift(h[i]);if(ate[i])G.sc[i]++;else s.pop()});
 if(ate.some((a,i)=>a&&!dead[i]))food();
 if(dead.some(Boolean)){
  G.over=1;G.x=dead;const[a,b]=G.sc;
  G.w=G.n<2?-1:(dead[0]&&dead[1]?(a>b?0:(b>a?1:-1)):(dead[0]?1:0));
 }
}
function tick(){step();if(G.over)clearInterval(tm);tx({t:'s',G});draw();ui()}
function start(){clearInterval(tm);init(dc&&dc.readyState=='open'?2:1);tm=setInterval(tick,TICK);tx({t:'s',G});draw();ui()}

/* ---- отрисовка ---- */
function draw(){
 const c=getComputedStyle(document.documentElement),v=k=>c.getPropertyValue(k).trim(),S=cv.width/N,ink=v('--ink'),bg=v('--board');
 cx.globalAlpha=1;cx.fillStyle=bg;cx.fillRect(0,0,600,600);cx.fillStyle=v('--soft');
 for(let x=0;x<N;x++)for(let y=0;y<N;y++)cx.fillRect(x*S+11,y*S+11,S-22,S-22);
 if(!G)return;
 const px=(G.f[0]+.5)*S,py=(G.f[1]+.5)*S,r=S*.4;
 cx.fillStyle=ink;cx.beginPath();cx.moveTo(px,py-r);cx.lineTo(px+r,py);cx.lineTo(px,py+r);cx.lineTo(px-r,py);cx.fill();
 G.s.forEach((s,i)=>{
  cx.globalAlpha=G.over&&G.x[i]?.35:1;cx.strokeStyle=ink;cx.lineWidth=4;
  s.forEach(([x,y],k)=>{
   if(i){cx.fillStyle=bg;cx.fillRect(x*S+1,y*S+1,S-2,S-2);cx.strokeRect(x*S+3,y*S+3,S-6,S-6)}
   else{cx.fillStyle=ink;cx.fillRect(x*S+1,y*S+1,S-2,S-2)}
   if(!k){cx.fillStyle=i?ink:bg;cx.fillRect(x*S+11,y*S+11,8,8)}
  });
 });
 cx.globalAlpha=1;
}
function ui(){
 const me=role=='guest'?1:0,two=G?G.n>1:role!='solo',L=i=>two?(i==me?'Вы':'Друг'):'Счёт';
 $('s0').innerHTML='<span class="m"></span>'+L(0)+': '+(G?G.sc[0]:0);
 $('s1').innerHTML=two?'<span class="m o"></span>'+L(1)+': '+(G?G.sc[1]:0):'';
 txt('st',!G?'Нажмите «Старт»':!G.over?'Стрелки, WASD или свайп':G.n<2?'Игра окончена':G.w<0?'Ничья':G.w==me?'Вы победили!':'Вы проиграли');
 $('go').hidden=!!G&&!G.over;txt('go',G?'Реванш':'Старт');
}

/* ---- сеть: WebRTC, обмен кодами вручную ---- */
const enc=async d=>{const s=new Blob([JSON.stringify(d)]).stream().pipeThrough(new CompressionStream('deflate-raw'));return btoa(String.fromCharCode(...new Uint8Array(await new Response(s).arrayBuffer())))};
const dec=async t=>{const b=Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text())};
const gathered=()=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState=='complete'&&r());setTimeout(r,5000)});
const mk=()=>{const p=new RTCPeerConnection(cfg);p.onconnectionstatechange=()=>{if(/failed|disconnected|closed/.test(p.connectionState)){clearInterval(tm);txt('st','Соединение потеряно. Нажмите «Выйти»');$('go').hidden=true}};return p};
function setup(c){
 dc=c;c.onopen=()=>{G=null;show('game');ui();draw()};
 c.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='s'){G=m.G;draw();ui()}
  else if(role=='host'&&m.t=='d'&&G)turn(1,m.v[0],m.v[1]);
  else if(role=='host'&&m.t=='r')start()};
}
$('b1').onclick=()=>{role='solo';show('game');start()};
$('b2').onclick=async()=>{
 role='host';show('net');txt('hint','1. Отправьте свой код другу. 2. Вставьте ниже его ответный код и нажмите «Подключить».');txt('ok','Подключить');$('out').value='Создаю код…';
 try{pc=mk();setup(pc.createDataChannel('g'));await pc.setLocalDescription(await pc.createOffer());await gathered();$('out').value=await enc(pc.localDescription)}
 catch(e){$('out').value='Ошибка: '+e.message}
};
$('b3').onclick=()=>{role='guest';show('net');txt('hint','1. Вставьте код хоста ниже и нажмите «Ответить». 2. Отправьте полученный код обратно хосту.');txt('ok','Ответить');$('out').value=''};
$('ok').onclick=async()=>{
 try{const d=await dec($('in').value);
  if(role=='host')await pc.setRemoteDescription(d);
  else{pc=mk();pc.ondatachannel=e=>setup(e.channel);await pc.setRemoteDescription(d);await pc.setLocalDescription(await pc.createAnswer());await gathered();$('out').value=await enc(pc.localDescription);txt('hint','Отправьте код выше хосту и дождитесь соединения…')}
 }catch(e){txt('hint','Код не подошёл: '+e.message)}
};
$('cp').onclick=async()=>{$('out').select();try{await navigator.clipboard.writeText($('out').value)}catch(e){document.execCommand('copy')}};
$('bk').onclick=$('ex').onclick=()=>location.reload();
$('go').onclick=()=>role=='guest'?tx({t:'r'}):start();

/* ---- управление ---- */
function dir(v){if(role=='guest')tx({t:'d',v});else if(G&&!G.over)turn(0,v[0],v[1])}
const K={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
addEventListener('keydown',e=>{const v=K[e.code];if(v&&!$('game').hidden){e.preventDefault();dir(v)}});
$('pad').onpointerdown=e=>{const v=e.target.dataset.v;if(v)dir(v.split(',').map(Number))};
let t0;cv.ontouchstart=e=>{t0=e.touches[0]};
cv.ontouchend=e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)dir(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])};
draw();
</script>
</body>
</html>
